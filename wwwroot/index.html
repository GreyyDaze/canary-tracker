<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canary Tracker</title>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e14; color: #e6e6e6; line-height: 1.5;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }

        header { margin-bottom: 32px; }
        header h1 {
            font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 2px;
            display: flex; align-items: center; gap: 8px;
        }
        header h1 svg { width: 20px; height: 20px; }
        header .sub {
            font-size: 13px; color: #6b7280;
            display: flex; align-items: center; gap: 12px;
        }
        header .sub .user-badge {
            background: #1a2332; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; color: #58a6ff;
        }
        code { background: #1a2332; padding: 2px 6px; border-radius: 3px; font-size: 12px; color: #58a6ff; }

        .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card {
            background: #121820; border: 1px solid #1f2937; border-radius: 8px;
            padding: 16px; flex: 1; min-width: 120px;
        }
        .stat-card svg { width: 16px; height: 16px; color: #6b7280; margin-bottom: 6px; }
        .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; }
        .stat-card .value { font-size: 24px; font-weight: 600; color: #fff; }
        .stat-card .value.red { color: #f85149; }
        .stat-card .value.green { color: #3fb950; }
        .stat-card .sub { font-size: 12px; color: #6b7280; margin-top: 2px; }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn {
            border: 1px solid #1f2937; border-radius: 6px; padding: 8px 16px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            background: #1a2332; color: #e6e6e6;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #243044; }
        .btn svg { width: 16px; height: 16px; }
        .btn-cloud { border-left: 3px solid #58a6ff; }
        .btn-infra { border-left: 3px solid #3fb950; }
        .btn-cred { border-left: 3px solid #f0883e; }
        .btn-small { padding: 4px 10px; font-size: 11px; }
        .btn-ack { background: transparent; border-color: #1f2937; color: #3fb950; }
        .btn-ack:hover { background: #0f2d1a; border-color: #3fb950; }
        .btn-resolve { background: transparent; border-color: #1f2937; color: #6b7280; }
        .btn-resolve:hover { background: #1a2332; }

        .panel {
            background: #121820; border: 1px solid #1f2937; border-radius: 8px;
            padding: 20px; margin-bottom: 20px;
        }
        .panel h2 {
            font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
            color: #6b7280; margin-bottom: 14px;
            display: flex; align-items: center; gap: 6px;
        }
        .panel h2 svg { width: 16px; height: 16px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; color: #6b7280; font-weight: 500; padding: 8px 8px 8px 0; border-bottom: 1px solid #1f2937; }
        td { padding: 10px 8px 10px 0; border-bottom: 1px solid #1a2332; }
        tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 500;
        }
        .badge svg { width: 12px; height: 12px; }
        .badge-active { background: #0f2d1a; color: #3fb950; }
        .badge-compromised { background: #3d1f1f; color: #f85149; }

        .alert-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 6px; margin-bottom: 6px;
            background: #0a0e14; border: 1px solid #1f2937;
        }
        .alert-new { border-left: 3px solid #f85149; }
        .alert-item svg { width: 16px; height: 16px; flex-shrink: 0; }
        .alert-body { flex: 1; }
        .alert-msg { font-size: 13px; }
        .alert-meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
        .alert-meta strong { color: #e6e6e6; }

        .empty-state { color: #6b7280; font-size: 13px; padding: 24px 0; text-align: center; }
        .empty-state svg { width: 16px; height: 16px; vertical-align: middle; margin-right: 6px; }

        .hint {
            background: #1a2332; border: 1px solid #1f2937; border-radius: 8px;
            padding: 14px 18px; font-size: 13px; color: #6b7280; margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><path d="M12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M12 11v6"/></svg>
            Canary Tracker
        </h1>
        <div class="sub">
            <span>Detect when decoy credentials are tampered or exfiltrated</span>
            <span class="user-badge">system: apple</span>
        </div>
    </header>

    <div class="hint">
        Deploy a canary below &rarr; a real credential file is written to <code>~/.config/canary/</code> &rarr; modify it (<code>echo "x" &gt;&gt; file</code>) or delete it (<code>rm file</code>) &rarr; the app detects the change and shows what process did it.
    </div>

    <div id="stats-bar"
         hx-get="/stats"
         hx-trigger="load, every 5s">
    </div>

    <div class="actions">
        <form hx-post="/canaries" hx-target="#canary-section" style="display:inline">
            <input type="hidden" name="name" value="aws-prod-key">
            <input type="hidden" name="category" value="Cloud">
            <button type="submit" class="btn btn-cloud">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                Deploy AWS Key
            </button>
        </form>
        <form hx-post="/canaries" hx-target="#canary-section" style="display:inline">
            <input type="hidden" name="name" value="ssh-staging-key">
            <input type="hidden" name="category" value="Infrastructure">
            <button type="submit" class="btn btn-infra">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 22H18a2 2 0 0 0 2-2V10l-7-7H6.5A2 2 0 0 0 4 5v15a2 2 0 0 0 2 2z"/><path d="M8 22V2"/><path d="M16 22V2"/><path d="M12 22V2"/></svg>
                Deploy SSH Key
            </button>
        </form>
        <form hx-post="/canaries" hx-target="#canary-section" style="display:inline">
            <input type="hidden" name="name" value="gitlab-passwords">
            <input type="hidden" name="category" value="Credential">
            <button type="submit" class="btn btn-cred">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="8" cy="8" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="10" cy="16" r="1"/><circle cx="14" cy="14" r="1"/></svg>
                Deploy Passwords
            </button>
        </form>
    </div>

    <div id="canary-section"
         hx-get="/canaries"
         hx-trigger="load, every 5s">
    </div>

    <div id="alert-section"
         hx-get="/alerts"
         hx-trigger="load, every 3s">
    </div>

</div>
</body>
</html>
